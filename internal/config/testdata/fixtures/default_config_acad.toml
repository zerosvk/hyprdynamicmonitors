[general]
# load it from hyprland.lua with: pcall(require, "monitors")
destination = "$HOME/.config/hypr/monitors.lua"
# "lua" for hyprland.lua (Hyprland 0.55+), "hyprlang" for the legacy hyprland.conf
hyprland_config_format = "lua"

[power_events]

[power_events.dbus_query_object]
path = "/org/freedesktop/UPower/devices/line_power_ACAD"

[[power_events.dbus_signal_match_rules]]
object_path = "/org/freedesktop/UPower/devices/line_power_ACAD"
